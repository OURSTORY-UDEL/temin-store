<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AppCraft Studio</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <!-- Beri id pada iframe -->
  <iframe id="app-frame" allow="autoplay; clipboard-write; encrypted-media;"></iframe>

  <script>
    // Ambil parameter halaman dari alamat browser (misalnya ?page=lms)
    const urlParams = window.location.search;
    
    // Tulis URL /exec Google Apps Script Anda disini
    const gasExecUrl = "https://script.google.com/macros/s/AKfycbzgIwTkRBNdr3Eoo4_qc55HpaDiyR6PxyKSku2UsqTUXFVFA7OMBilqZBjrHRnoPU57Zg/exec";
    
    // Muat halaman yang sesuai secara dinamis di dalam iframe
    document.getElementById('app-frame').src = gasExecUrl + urlParams;
  </script>
</body>
</html>
